# Pandan 自用插件源配置
# 修改后重新运行 scripts/repo.py 即可。

origin = Pandan Repo
label = Pandan Repo
suite = stable
codename = ios
version = 1.0
description = Pandan 自用 iOS 插件源（roothide / rootless）

# 发布后的公网根地址，末尾不要加斜杠。
# 例如 GitHub Pages: https://pandan.github.io/repo
# 留空时不会给单个插件生成 Icon 字段，其余功能不受影响。
base_url = https://pandan129-pixel.github.io/Chajian

# 索引里声明的架构。Debian 索引必须覆盖你实际分发的所有架构，
# 否则对应设备会"看不到"包。
architectures = iphoneos-arm64 iphoneos-arm64e

# 扫描哪些目录下的 deb（相对本仓库根目录，支持通配符）。
# 默认只收集最新版本；加 --keep-all 可保留全部历史版本。
source_globs =
    ../plugins/*/dist
    ../jbb/dist
    ../jb-bypass/dist
    debs-in

# 可选：不发布的包（空格分隔）。
# bhtwitter 是第三方重打包；xianyu322 是旧的 3.2.2 合并版，当前用 xianyuduo。
exclude_packages = com.bandarhl.bhtwitter com.pandan.xianyu322

# 可选：给单个包指定图标（放在 docs/icons/<包名>.png 即可，脚本会自动引用）。
# 例如 docs/icons/com.pandan.jbb.png
